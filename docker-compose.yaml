services:
  mongo:
    image: mongo:latest
    pull_policy: missing
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  rabbitmq:
    image: rabbitmq:3-management
    pull_policy: missing
    container_name: rabbitmq 
    ports:
      - "5672:5672"
      - "15672:15672" 
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq 
  user-service:
    build: ./user-service
    pull_policy: always
    container_name: user-service
    ports:
      - "3001:3001"
    depends_on:
      - mongo
      - rabbitmq
  task-service:
    build: ./task-service 
    pull_policy: always
    container_name: task-service
    ports:
      - "3002:3002"
    depends_on:
      - mongo
      - rabbitmq
  notification-service:
    build: ./notification-service 
    pull_policy: always
    container_name: notification-service
    ports:
      - "3003:3003"
    depends_on:
      - rabbitmq
volumes:
  mongo-data:
  rabbitmq-data:

